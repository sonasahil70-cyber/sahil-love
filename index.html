<!DOCTYPE html>
<html lang="en">
<head>


<title>❤️ For Rupali ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff0080,#ff4d6d,#7b2ff7,#0099ff);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:700px;
padding:35px;
text-align:center;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:25px;
box-shadow:0 0 35px rgba(255,255,255,.25);
color:white;
z-index:10;
}

h1{
font-size:42px;
margin-bottom:20px;
animation:beat 1.2s infinite;
}

@keyframes beat{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.);
}
}

#message{
margin-top:20px;
font-size:20px;
line-height:1.8;
min-height:260px;
white-space:pre-wrap;
}

button{
margin-top:25px;
padding:14px 35px;
font-size:18px;
border:none;
border-radius:50px;
background:white;
color:#ff0066;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:absolute;
color:white;
animation:float linear infinite;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:1;
}

100%{
transform:translateY(-10vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️Rupali ji ❤️</h1>

<div id="message"></div>

<top onclick="love()">
Click My Heart ❤️
</top>

</div>

<audio id="music" loop>
<source src="Direct Romantic Song MP3 Link" type="audio/mpeg">
</audio>

<script>
const text =`Ek Pyara Sa Khat
 
 
​*"Pata nahi ye letter kahan se shuru karun, kyunki jitna main tumhare baare mein sochta hoon, utne hi kam lafz lagte hain."*
 
  
​**Zindagi Ka Badalta Rang**
 
​Jab se tum meri zindagi mein aayi ho, tab se har din ka matlab badal gaya hai.
 
Pehle waqt bas guzar jaata tha, ab har pal mehsoos hota hai.
 
 
- ​Tumhari ek muskaan mere poore din ko roshan kar deti hai.
 
- ​Tumhari ek choti si baat mere dil ko sukoon de deti hai.
 
- ​Kabhi kabhi bas tumhara naam dekhkar hi chehre par muskaan aa jaati hai.
​Mujhe tumhari aadat nahi lagi...

**Mujhe tumse mohabbat ho gayi hai.**
 
Aisi mohabbat jo waqt ke saath kam nahi, aur gehri hoti jaati hai.
 
### ​**Mera Wada, Mera Saath**
 
​Main tumhe badalne ki kabhi koshish nahi karunga. Main sirf tumhara saath dena chahta hoon.
 
 
- ​Tumhari har khushi meri khushi hai.
 
- ​Tumhara har dard dekhkar mera dil bhi bhar aata hai.
 
- ​Main chahta hoon ki jab bhi tum thak jao, tumhe lage ki koi hai jo tumhare saath khada hai—**main wahi insaan banna chahta hoon.**
 

 
​Mujhe tumhari hasi pasand hai, tumhari baatein pasand hain, tumhara gussa bhi pasand hai. Mujhe tumhari har woh baat pasand hai jo tumhe *tum* banati hai.
 
​Main perfect nahi hoon, galtiyan mujhse bhi hongi. Lekin ek baat ka wada karta hoon:
 
 
- ​Main har galti se seekhne ki koshish karunga.
 
- ​Main tumhari izzat hamesha karunga.
 
- ​Main tumhari baat sununga aur tumhare sapno ka samman karunga.
 

 
### ​**Anmol Pal Aur Yaadein**
 
​Tum meri zindagi ki sabse khoobsurat yaadon mein se ek ho.
 
 
- ​Tumhari aankhon mein mujhe ek alag hi sukoon milta hai.
 
- ​Tumhari awaaz mere liye ek pyari si melody jaisi hai.
 
- ​Tumhare saath bitaya hua har pal mere liye anmol hai.
 

 
​Main chahta hoon ki hum saath mein aur bhi bahut si yaadein banayein—haste hue, seekhte hue, aur ek doosre ka hausla badhate hue. Kabhi kabhi main sochta hoon, aakhir itni si duniya mein meri mulaqat tumse hi kyun hui? Shayad isliye, kyunki kuch log hamari zindagi ko behtar bana dete hain, aur tum unhi logon mein se ho.
 
 ​**Ek Khubsurat Safar**
 
​Agar kabhi humare beech dooriyan aa jaayein, toh yaad rakhna... sachchi mohabbat sirf paas rehne se nahi, bharose aur ehteraam se bhi mazboot hoti hai.
 
​Tumhare saath har choti si baat bhi khaas lagti hai—ek message, ek call, ek hasi, ya ek *"Kaise ho?"* Ye sab mere liye bahut keemti hai.
 
​Main dua karta hoon ki tum hamesha khush raho, hamesha muskurao, aur tumhare saare sapne poore hon.
 
 
- ​**Shukriya** meri zindagi ka hissa banne ke liye.
 
- ​**Shukriya** mujhe samajhne ki koshish karne ke liye.
 
- ​**Shukriya** har us pal ke liye jo humne saath mehsoos kiya.
 

 
​Main aaj bhi tumhari izzat karta hoon, kal bhi karunga, aur har aane wale din mein bhi karta rahunga. Meri dua sirf itni hai ki tum hamesha khush raho, aur agar hamara safar saath chale, toh main us safar ko mohabbat, bharose aur ehteraam se khoobsurat banane ki poori koshish karunga.
 
​*Hamesha tumhari khushi ki dua karne wala,*
 
**Tumhara.**
I love you `;

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter,100);
    }
}

function love() {
    document.getElementById("music").play();

    document.getElementById("message").innerHTML = "";

    i = 0;

    typeWriter();
}
// ❤️ Floating Hearts
for (let i = 0; i < 150; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animationDuration = (3 + Math.random() * 6) + "s";
    heart.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(heart);
}

// ✨ Sparkles
const sparkle = ["💖","🌸","💕"];

setInterval(() => {
    let s = document.createElement("div");

    s.innerHTML = sparkle[Math.floor(Math.random() * sparkle.length)];
    s.style.position = "absolute";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.fontSize = (15 + Math.random() * 20) + "px";
    s.style.opacity = "1";
    s.style.transition = "all 2s ease";

    document.body.appendChild(s);

    setTimeout(() => {
        s.style.opacity = "0";
        s.style.transform = "translateY(-30px)";
    }, 100);

    setTimeout(() => {
        s.remove();
    }, 2200);

}, 400);

</script>

</body>
</html>
