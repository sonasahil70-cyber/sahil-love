<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️Rupali ji❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff0080,#ff4d6d,#7b2ff7,#0099ff);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:700px;
padding:35px;
text-align:center;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:25px;
box-shadow:0 0 35px rgba(255,255,255,.25);
color:white;
z-index:10;
}

h1{
font-size:42px;
margin-bottom:20px;
animation:beat 1.2s infinite;
}

@keyframes beat{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.12);
}
}

#message{
margin-top:20px;
font-size:20px;
line-height:1.8;
min-height:260px;
white-space:pre-wrap;
}

button{
margin-top:25px;
padding:14px 35px;
font-size:18px;
border:none;
border-radius:50px;
background:white;
color:#ff0066;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:absolute;
color:white;
animation:float linear infinite;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:1;
}

100%{
transform:translateY(-10vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Dear Rupali ❤️</h1>

<div id="message"></div>

<button onclick="love()">
Click My Heart ❤️
</button>

</div>

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
const text = ` Meri Pyari, ❤️

Jab se tum meri zindagi mein aayi ho, tab se meri duniya hi badal gayi hai. Pehle din bas guzar jaate the, lekin ab har subah tumhari yaad se shuru hoti hai aur har raat tumhari muskaan ke khayalon mein dhal jaati hai. Tum sirf meri zindagi ka ek hissa nahi ho, tum meri har dua, har khushi aur har sapne ki wajah ban chuki ho.

Main tumse sirf pyaar nahi karta... main tumhe apni har saans mein mehsoos karta hoon. Tumhari ek muskaan meri saari thakan mita deti hai, tumhari ek awaaz mere dil ko sukoon de deti hai. Tumhari hasi meri pasandida dhun hai, tumhari baatein meri rooh ka sukoon hain, aur tumhari aankhen woh jagah hain jahan main apni poori duniya dekh leta hoon.

Main kabhi tumhe badalne ki koshish nahi karunga, kyunki jis tarah tum ho, usi tarah meri duniya ki sabse khoobsurat insaan ho. Main bas itna chahta hoon ki har mushkil mein tumhara haath tham kar chalun, har aansu ko apni muskaan se mita doon, aur har khushi ko tumhare saath do guna mehsoos karun.

Agar kabhi humare beech dooriyan bhi aa jaayein, toh sirf itna yaad rakhna ki mera dil hamesha tumhare paas rahega. Waqt badal sakta hai, halaat badal sakte hain, lekin meri mohabbat kabhi nahi badlegi. Main har din, har pal aur har janam tumse isi tarah beinteha mohabbat karta rahunga.

Meri ek hi khwahish hai... jab bhi log mujhse meri sabse badi khushi ka naam poochein, main bina soche sirf tumhara naam loon. Aur jab meri zindagi ki aakhri saans ho, tab bhi meri aankhon ke saamne sirf tumhari muskaan ho.

Shukriya meri zindagi mein aane ke liye. Shukriya mujhe itna khaas mehsoos karwane ke liye. Aur shukriya har us lamhe ke liye jo tumhare saath guzra aur meri zindagi ka sabse haseen hissa ban gaya.

Main tumse aaj bhi utni hi mohabbat karta hoon, kal bhi karunga, aur jab tak meri saansein chalengi tab tak karta rahunga. ❤️

Hamesha tumhari khushi ki dua karne wala,
Sirf Tumhara. ❤️

❤️ I Love You So Much Rupali ❤️

Forever & Always 💖`;

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}

function love() {
    document.getElementById("music").play();

    document.getElementById("message").innerHTML = "";

    i = 0;

    typeWriter();
}
// ❤️ Floating Hearts
for (let i = 0; i < 150; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animationDuration = (3 + Math.random() * 6) + "s";
    heart.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(heart);
}

// ✨ Sparkles
const sparkle = ["✨","💖","🌸","💕"];

setInterval(() => {
    let s = document.createElement("div");

    s.innerHTML = sparkle[Math.floor(Math.random() * sparkle.length)];
    s.style.position = "absolute";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.fontSize = (15 + Math.random() * 20) + "px";
    s.style.opacity = "1";
    s.style.transition = "all 2s ease";

    document.body.appendChild(s);

    setTimeout(() => {
        s.style.opacity = "0";
        s.style.transform = "translateY(-40px)";
    }, 100);

    setTimeout(() => {
        s.remove();
    }, 2200);

}, 400);

</script>

</body>
</html>
